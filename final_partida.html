<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortuna Familiar - ¡Fin de la Partida!</title>
    <link rel="stylesheet" href="style_final.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body data-pagina="final">

    <div class="final-container" id="final-partida">
        <header class="final-header">
            <h1 class="end-title">¡PARTIDA<br><span>FINALIZADA!</span></h1>
            <p class="end-subtitle">Resultados después de 10 años de especulación</p>
        </header>

        <!-- Estadísticas personales -->
        <section class="stats-section card-glass">
            <h3 class="section-title">Tu Desempeño</h3>
            <div class="stats-grid">
                <div class="stat-card">
                    <p class="stat-label">Capital Inicial</p>
                    <p id="stat-capital-inicial" class="stat-value">$10,000</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Capital Final</p>
                    <p id="stat-capital-final" class="stat-value">$0.00</p>
                </div>
                <div class="stat-card">
                    <p class="stat-label">Rendimiento Total</p>
                    <p id="stat-rendimiento" class="stat-value">+0%</p>
                </div>
                <div class="stat-card" id="card-mejor-ronda">
                    <p class="stat-label">Mejor Ronda</p>
                    <p id="stat-mejor-ronda" class="stat-value">—</p>
                </div>
            </div>
        </section>

        <!-- Diploma de inversor -->
        <section class="profile-section card-glass">
            <h3 class="section-title">Tu Diploma de Inversor</h3>
            <div class="profile-card active">
                <div id="perfil-icono" class="profile-icon">📊</div>
                <div class="profile-text">
                    <h4 id="perfil-titulo">Calculando…</h4>
                    <p id="perfil-descripcion">Analizando tu estrategia…</p>
                </div>
            </div>
        </section>

        <!-- Podio familiar (solo multijugador) -->
        <section id="podio-seccion" class="podium-section card-glass" hidden>
            <h3 class="section-title">El Podio Familiar</h3>
            <div id="podio-lista"></div>
        </section>

        <footer class="final-footer">
            <button id="btn-nueva-partida" class="btn-restart" type="button">NUEVA PARTIDA</button>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="config_firebase.js"></script>
    <script src="multijugador.js"></script>
    <script src="motor_juego.js"></script>
</body>
</html>
