<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortuna Familiar - Resultados</title>
    <link rel="stylesheet" href="style_resultados.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="results-container">
        <header class="results-header">
            <h1 id="round-title" class="round-title">CIERRE DE AÑO...</h1>
            <p class="market-status">El mercado ha reaccionado...</p>
        </header>

        <div class="performance-card card-glass">
            <p class="label">Nuevo Balance</p>
            <h2 id="final-balance" class="profit">$11,240</h2>
            <div class="gain-badge">+ $1,240 (12.4%)</div>
        </div>

        <section class="breakdown-section">
            <h3 class="section-title">Rendimiento por Sector</h3>
            
            <div class="asset-result card-glass">
                <div class="asset-info">
                    <span class="icon">💻</span>
                    <div>
                        <p class="asset-name">Tecnología</p>
                        <p class="delta-news">Subida por alta demanda</p>
                    </div>
                </div>
                <div class="asset-math plus">+15%</div>
            </div>

            <div class="asset-result card-glass">
                <div class="asset-info">
                    <span class="icon">🍎</span>
                    <div>
                        <p class="asset-name">Alimentos</p>
                        <p class="delta-news">Caída por regulaciones</p>
                    </div>
                </div>
                <div class="asset-math minus">-8%</div>
            </div>
            
            </section>

        <div class="mini-leaderboard card-glass">
            <h4>Líder de la Ronda:</h4>
            <div class="leader-row">
                <div class="leader-avatar"></div>
                <span id="leader-info">Cargando...</span>
            </div>
        </div>

        <button id="btn-next" class="btn-next" onclick="irAlSiguienteAño()">CONTINUAR</button>
    </div>
    <script src="motor_juego.js"></script>
</body>
</html>
