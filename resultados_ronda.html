<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortuna Familiar - Resultados</title>
    <link rel="stylesheet" href="style_resultados.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="results-container">
        <header class="results-header">
            <h1 id="round-title" class="round-title">CIERRE DE AÑO...</h1>
            <p class="market-status">El mercado ha reaccionado...</p>
        </header>

        <!-- Sección de Noticia con Explicación -->
        <section class="noticia-contenedor">
            <h2 id="titular-noticia" class="noticia__titular">Cargando noticia...</h2>
            <p id="explicacion-noticia" class="noticia__descripcion">Aquí aparecerá el porqué de la variación del mercado.</p>
        </section>

        <hr class="separador">

        <!-- Sección de Desglose Financiero -->
        <section class="balance-contenedor">
            <div class="balance__item">
                <span>Capital Anterior:</span>
                <span id="capital-anterior">$0.00</span>
            </div>
            
            <!-- Este es el nuevo campo clave que pediste -->
            <div id="contenedor-resultado-neto" class="balance__resultado">
                <span id="etiqueta-resultado">Resultado de la ronda:</span>
                <span id="valor-resultado-neto">$0.00</span>
            </div>

            <div class="balance__total">
                <span>Nuevo Balance Total:</span>
                <span id="capital-actual">$0.00</span>
            </div>
        </section>

        <!-- Sección del Jugador (Podio) -->
        <footer class="podio-contenedor">
            <p class="podio__texto">Jugador actual: <strong id="nombre-jugador-display">---</strong></p>
        </footer>

        <button id="btn-next" class="btn-next" onclick="irAlSiguienteAño()">CONTINUAR</button>
    </div>
    <script src="motor_juego.js"></script>
</body>
</html>
