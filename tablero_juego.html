<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fortuna Familiar - En Vivo</title>
    <link rel="stylesheet" href="style_tablero.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body data-pagina="tablero">

    <div class="game-container" id="tablero-juego">
        <h1 class="sr-only">Fortuna Familiar — Tablero de juego</h1>
        <header class="game-header card-glass">
            <div class="player-info">
                <div id="mini-avatar-emoji" class="mini-avatar"></div>
                <div>
                    <p class="label">Capital Actual</p>
                    <h2 id="balance" class="amount">$10,000</h2>
                </div>
            </div>
            <div class="game-stats">
                <p id="year-display" class="label">Año 1/10</p>
                <div id="timer-seconds" class="timer">30s</div>
            </div>
        </header>

        <!-- Estado multijugador: jugadores listos -->
        <p id="mp-status" class="mp-status card-glass" hidden aria-live="polite"></p>

        <section class="news-section card-glass border-glow">
            <div class="news-badge">BREAKING NEWS</div>
            <h3 id="news-text">Cargando noticia del mercado…</h3>
            <p class="news-hint">¿Cómo reaccionará cada activo este año?</p>
        </section>

        <!-- Tarjetas generadas por motor_juego.js a partir de ASSETS -->
        <main id="assets-grid" class="assets-grid" aria-label="Activos de inversión"></main>

        <footer class="game-footer">
            <!-- Resumen de asignación en vivo -->
            <section class="resumen card-glass" aria-live="polite">
                <div class="resumen-fila">
                    <span>Asignado: <strong id="total-asignado">$0.00</strong></span>
                    <span>Disponible: <strong id="efectivo-restante">$10,000.00</strong></span>
                </div>
                <div id="barra-progreso" class="barra-progreso"
                     role="progressbar" aria-label="Porcentaje del capital asignado">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </section>

            <button id="btn-invertir" class="btn btn-primary btn-confirm" type="button" disabled>
                CONFIRMAR ESTRATEGIA
            </button>
        </footer>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="config_firebase.js"></script>
    <script src="multijugador.js"></script>
    <script src="motor_juego.js"></script>
</body>
</html>
